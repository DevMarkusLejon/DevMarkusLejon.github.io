  <circle cx="535" cy="535" r="34" fill="#c84f3a"/>
  <text x="710" y="250" fill="#171b1f" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="800">Grids AI Runs</text>
  <text x="710" y="320" fill="#5f686f" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Drop an MP4 into assets/videos/grids-ai-demo.mp4</text>
