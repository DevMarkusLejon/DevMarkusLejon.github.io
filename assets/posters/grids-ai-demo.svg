<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Grids AI demo poster</title>
  <desc id="desc">A stylized grid-world game poster with an agent path.</desc>
  <rect width="1280" height="720" fill="#fffdf8"/>
  <rect x="80" y="80" width="560" height="560" rx="18" fill="#e9e3d6" stroke="#171b1f" stroke-opacity=".2" stroke-width="3"/>
  <g fill="none" stroke="#171b1f" stroke-opacity=".14" stroke-width="3">
    <path d="M150 80v560M220 80v560M290 80v560M360 80v560M430 80v560M500 80v560M570 80v560"/>
    <path d="M80 150h560M80 220h560M80 290h560M80 360h560M80 430h560M80 500h560M80 570h560"/>
  </g>
  <g fill="#171b1f" fill-opacity=".18">
