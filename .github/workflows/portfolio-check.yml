name: Portfolio Checks

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "script.js"
      - "projects/**"
      - "grids/**"
      - "tools/grids/**"
      - "assets/**"
      - "favicon.svg"
      - "robots.txt"
      - "sitemap.xml"
      - "scripts/check-portfolio.py"
      - "scripts/check-grids.py"
      - ".github/workflows/portfolio-check.yml"
  pull_request:
    paths:
      - "index.html"
      - "styles.css"
      - "script.js"
      - "projects/**"
      - "grids/**"
      - "tools/grids/**"
      - "assets/**"
      - "favicon.svg"
      - "robots.txt"
      - "sitemap.xml"
      - "scripts/check-portfolio.py"
      - "scripts/check-grids.py"
      - ".github/workflows/portfolio-check.yml"
  workflow_dispatch:

jobs:
  portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check local links and assets
        run: python scripts/check-portfolio.py
      - name: Check Grids browser bundle
        run: python scripts/check-grids.py
      - name: Check Grids JavaScript syntax
        run: |
          node --check grids/browser-bridge.js
          node --check grids/browser-worker.mjs
      - name: Install Grids test dependencies
        run: python -m pip install numpy pytest
      - name: Test Grids save restore and inspector
        working-directory: tools/grids
        env:
          PYTHONPATH: src
        run: python -m pytest tests -q
