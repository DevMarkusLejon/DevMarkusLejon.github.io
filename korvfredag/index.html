<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f8f3e6"><meta name="description" content="Är det korvfredag? Svaret på veckans viktigaste fråga, direkt och på svensk tid."><title>Äre korvfredag? 🌭</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap');
:root{--ink:#283f2b;--cream:#f8f3e6;--green:#526c43;--red:#c34935;--gold:#e8bd50}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'DM Sans',sans-serif;min-height:100svh}body:before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.17;background-image:radial-gradient(#776c4d .65px,transparent .65px);background-size:5px 5px}header{height:84px;display:flex;align-items:center;justify-content:space-between;max-width:1320px;margin:auto;padding:0 6%;position:relative}.brand{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:-.05em;font-size:21px}.badge{font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;border:1px solid #8a9a80;border-radius:50px;padding:9px 13px}.dot{display:inline-block;background:#7b9a63;width:7px;height:7px;border-radius:50%;margin-right:7px}.main{max-width:1200px;margin:20px auto 0;min-height:calc(100svh - 165px);padding:0 6% 50px;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:5%}.copy{position:relative;z-index:1}.eyebrow{font-size:11px;letter-spacing:.22em;font-weight:700;text-transform:uppercase;display:flex;align-items:center;gap:10px}.eyebrow:before{content:'';width:27px;height:2px;background:var(--red)}h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(62px,9vw,124px);letter-spacing:-.075em;line-height:.9;margin:24px 0 18px}h1 span{color:var(--red)}.answer{font-family:'Space Grotesk',sans-serif;font-size:clamp(42px,7vw,84px);font-weight:700;letter-spacing:-.065em;margin:0 0 10px}.description{font-size:17px;line-height:1.6;max-width:390px;color:#576655;margin:0 0 32px}.timer{display:inline-flex;gap:16px;align-items:center;border-top:1px solid #bdc4b3;padding-top:19px;min-width:min(390px,100%)}.timer-icon{width:42px;height:42px;border-radius:50%;background:#e7e8d8;display:grid;place-items:center;font-size:20px}.timer-label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:#758172;font-weight:700;margin-bottom:5px}.timer-value{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700}.art{position:relative;display:grid;place-items:center;min-width:0}.plate{width:min(100%,520px);aspect-ratio:1;border-radius:50%;background:#e2e7d3;position:relative;display:grid;place-items:center}.plate:before{content:'';position:absolute;inset:8%;border:1px solid #c2cfb8;border-radius:50%}.sun{position:absolute;top:8%;right:2%;width:98px;height:98px;background:var(--gold);border-radius:50%;display:grid;place-items:center;text-align:center;font-weight:700;font-size:10px;line-height:1.3;letter-spacing:.12em;transform:rotate(12deg)}svg{width:90%;overflow:visible;filter:drop-shadow(0 20px 16px #5f6b4330)}.spark{position:absolute;color:var(--red);font-size:35px}.spark.a{top:17%;left:4%}.spark.b{bottom:15%;right:5%;color:#bd8d2e}footer{position:relative;border-top:1px solid #d7dacb;display:flex;justify-content:space-between;align-items:center;padding:20px 6%;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:#6e7b68}footer span:last-child{letter-spacing:0;text-transform:none;font-weight:500}.heart{color:var(--red)}@media(max-width:700px){header{height:70px}.badge{font-size:9px}.main{display:flex;flex-direction:column-reverse;gap:25px;align-items:stretch;margin:5px auto 0;padding-bottom:45px}.art{max-width:380px;width:85%;margin:auto}.plate{width:100%}.sun{width:75px;height:75px;font-size:8px}h1{font-size:clamp(58px,15vw,90px);margin:18px 0 12px}.answer{font-size:55px}.description{font-size:15px;margin-bottom:23px}footer{gap:15px;line-height:1.5}}
</style></head><body><header><div class="brand">🌭 &nbsp;äre korvfredag?</div><div class="badge"><span class="dot"></span>Alltid svensk tid</div></header><main class="main"><section class="copy"><div class="eyebrow">En fråga. Ett svar.</div><h1>Äre<br><span>korvfredag?</span></h1><p class="answer" id="answer" aria-live="polite">Kollar...</p><p class="description" id="desc">Vi konsulterar korvkalendern.</p><div class="timer"><div class="timer-icon">⏱</div><div><span class="timer-label" id="timer-label">Till nästa korvfredag</span><span class="timer-value" id="countdown">Ett ögonblick...</span></div></div></section><div class="art" aria-label="Illustration av en korv med bröd"><div class="plate"><div class="spark a">✳</div><div class="spark b">✦</div><div class="sun">FÖR ALLA<br>KORVÄLSKARE<br>♥</div><svg viewBox="0 0 500 360" role="img" aria-label="Glad korv med senap i bröd"><g transform="rotate(-15 250 180)"><ellipse cx="250" cy="220" rx="196" ry="73" fill="#b77a38"/><rect x="50" y="125" width="400" height="128" rx="64" fill="#e6ab58"/><rect x="72" y="120" width="356" height="106" rx="53" fill="#b85b3e"/><path d="M96 151c35-34 51 34 86 0s51 34 86 0 51 34 86 0 51 34 70 6" fill="none" stroke="#f7d26a" stroke-width="12" stroke-linecap="round"/><path d="M76 215c47 26 302 33 347-4" fill="none" stroke="#f3c77a" stroke-width="8" stroke-linecap="round" opacity=".75"/><circle cx="214" cy="191" r="5" fill="#53382b"/><circle cx="279" cy="191" r="5" fill="#53382b"/><path d="M232 198q14 15 28 0" fill="none" stroke="#53382b" stroke-width="4" stroke-linecap="round"/></g></svg></div></div></main><footer><span>En liten sida för en stor tradition.</span><span>Gjord med <span class="heart">♥</span> och senap</span></footer><script>
const weekday=new Intl.DateTimeFormat('en-US',{timeZone:'Europe/Stockholm',weekday:'short'}); const el=id=>document.getElementById(id); function update(){const now=Date.now(), isFriday=weekday.format(new Date(now))==='Fri'; el('answer').textContent=isFriday?'JA! 🎉':'Inte än.';el('desc').textContent=isFriday?'Det är korvfredag. Fram med korven och fira att veckan klarades av!':'Men håll ut, något riktigt gott väntar runt hörnet.';el('timer-label').textContent=isFriday?'Njut av korvfredagen':'Till nästa korvfredag'; if(isFriday){el('countdown').textContent='Det är din stund nu 🌭';return} let lo=now,hi=now+8*86400000; // Locate the start of the next Friday, using Stockholm's local weekday.
for(let t=now+3600000;t<=now+8*86400000;t+=3600000){if(weekday.format(new Date(t))==='Fri'){hi=t;lo=t-3600000;break}}while(hi-lo>1000){const mid=Math.floor((hi+lo)/2);if(weekday.format(new Date(mid))==='Fri')hi=mid;else lo=mid}const s=Math.max(0,Math.ceil((hi-now)/1000));const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),sec=s%60;el('countdown').textContent=`${d} dagar · ${String(h).padStart(2,'0')} h · ${String(m).padStart(2,'0')} min · ${String(sec).padStart(2,'0')} sek`;}update();setInterval(update,1000);
</script></body></html>
